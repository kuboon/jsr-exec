name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for publish rights
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          # `registry-url` is deliberately not set. It makes setup-node write
          # `_authToken=${NODE_AUTH_TOKEN}` into .npmrc, and with no token in
          # the environment npm reads that as "auth is already configured" and
          # never starts the OIDC exchange, failing with ENEEDAUTH. Publishing
          # goes to registry.npmjs.org by default anyway.
          package-manager-cache: false # never cache in a release build
      # Trusted publishing needs npm 11.5.1 or newer, `npm stage` 11.15.0.
      - run: npm install -g npm@latest
      - run: npm test

      # No NODE_AUTH_TOKEN: the registry authenticates this job through
      # trusted publishing (OIDC), which also attests provenance on its own —
      # `--provenance` is not needed and is left off deliberately.
      #
      # This stages the version rather than releasing it. It becomes
      # installable only once a maintainer runs `npm stage approve <id>` and
      # answers the 2FA challenge, so a compromised workflow cannot ship on
      # its own.
      - name: Stage the release for approval
        run: npm stage publish
