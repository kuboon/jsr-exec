name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  stage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # `npm stage` needs npm 11.15.0 or newer; the bundled npm may be older.
      - run: npm install -g npm@latest
      - run: npm test
      # Stages the version rather than releasing it. It becomes installable
      # only once a maintainer runs `npm stage approve <id>` and answers the
      # 2FA challenge, so a compromised workflow cannot ship on its own.
      - run: npm stage publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
